apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: web
    track: {{ .Values.track }}：
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}